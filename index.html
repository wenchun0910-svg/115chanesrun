<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長安小鐵人計時表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0f9ff; }
        .btn-circle-student { transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn-circle-student:active { transform: scale(0.95); }
        .result-table th, .result-table td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; white-space: nowrap; }
        .result-table th { background-color: #3b82f6; color: white; position: sticky; top: 0; }
        .result-table tr:nth-child(even) { background-color: #f8fafc; }
        
        /* 頁籤樣式 */
        .tab-btn { @apply px-6 py-2 font-bold text-gray-500 border-b-4 border-transparent hover:text-blue-600 transition; }
        .tab-btn.active { @apply text-blue-600 border-blue-600; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative pb-20">

    <!-- 頂部導航與設定 -->
    <div class="bg-white shadow-md z-20">
        <div class="p-4 flex flex-wrap items-center justify-between">
            <h1 class="text-2xl font-bold text-blue-800 tracking-wider">長安小鐵人計時表</h1>
            <div class="bg-blue-100 text-blue-800 px-4 py-2 rounded-lg font-bold text-sm">
                班級人數：24 人 (固定)
            </div>
        </div>
        
        <!-- 頁籤切換 -->
        <div class="flex justify-center space-x-4 bg-gray-50 border-t border-gray-100">
            <button onclick="switchTab('timer')" id="tab-timer" class="tab-btn active">⏱️ 計時模式</button>
            <button onclick="switchTab('query')" id="tab-query" class="tab-btn">📊 查詢紀錄</button>
        </div>
    </div>

    <!-- 主要內容區 -->
    <div class="flex-grow container mx-auto px-4 py-8 flex flex-col items-center w-full">

        <!-- ======================= 計時模式區塊 ======================= -->
        <div id="timerSection" class="w-full flex flex-col items-center">
            <div class="mb-6 text-center">
                <div id="timerDisplay" class="text-7xl sm:text-8xl font-mono font-bold text-gray-800 tracking-widest tabular-nums drop-shadow-sm">
                    00:00
                </div>
                <div class="text-gray-400 text-sm mt-1">分 : 秒 . 毫秒</div>
                <div id="startTimeDisplay" class="text-blue-500 font-medium mt-2 h-6 text-sm"></div>
            </div>

            <button id="mainControlBtn" onclick="toggleTimer()" 
                    class="mb-10 px-10 py-4 text-2xl font-bold rounded-full text-white shadow-lg transform transition hover:-translate-y-1 hover:shadow-xl bg-green-500 hover:bg-green-600 focus:outline-none ring-4 ring-green-200">
                計時開始
            </button>

            <div id="studentGrid" class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-8 gap-4 w-full max-w-5xl mb-8">
                <!-- 按鈕由 JS 生成 -->
            </div>

            <div id="resultSection" class="w-full max-w-3xl hidden animate-fade-in-up">
                <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
                    <div class="p-4 bg-blue-50 border-b border-blue-100 flex justify-between items-center">
                        <h3 class="text-lg font-bold text-blue-800">⏱️ 本次成績</h3>
                        <button onclick="uploadToGoogleSheets()" class="flex items-center gap-2 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm font-bold shadow-sm transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                            </svg>
                            上傳資料
                        </button>
                    </div>
                    <div class="overflow-x-auto p-4">
                        <table class="w-full result-table" id="scoreTable">
                            <thead>
                                <tr>
                                    <th class="w-1/3">座號</th>
                                    <th class="w-1/3">成績</th>
                                    <th class="w-1/3">狀態</th>
                                </tr>
                            </thead>
                            <tbody id="scoreTableBody" class="text-gray-700"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- ======================= 查詢模式區塊 ======================= -->
        <div id="querySection" class="w-full flex-col items-center hidden max-w-5xl">
            <div class="bg-white p-6 rounded-xl shadow-lg w-full mb-6 border border-gray-200">
                <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                    <label class="font-bold text-gray-700">選擇查詢週次：</label>
                    <input type="week" id="queryWeekInput" class="border-2 border-blue-200 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                    <button onclick="fetchAndFilterData()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-bold shadow-md transition flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        查詢
                    </button>
                </div>
                <p class="text-center text-gray-500 text-sm mt-3" id="queryStatusText">請選擇週次並點擊查詢</p>
                <div class="text-center mt-2 text-xs text-gray-400">
                    * 如果出現失敗，請檢查 Google Script 部署權限是否為「所有人」
                </div>
            </div>

            <div id="queryResultContainer" class="w-full bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 hidden">
                <div class="overflow-x-auto max-h-[60vh]">
                    <table class="w-full result-table" id="queryTable">
                        <thead id="queryTableHead">
                            <!-- 動態生成表頭 -->
                        </thead>
                        <tbody id="queryTableBody" class="text-gray-700">
                            <!-- 動態生成內容 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- 底部功能區 -->
    <div class="fixed bottom-0 left-0 w-full p-4 pointer-events-none flex justify-between items-end z-20">
        <button id="resetBtn" onclick="resetAll()" class="pointer-events-auto bg-red-500 text-white px-6 py-2 rounded-full shadow-lg hover:bg-red-600 font-bold transition flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            重置
        </button>
        <div class="bg-white/80 backdrop-blur px-4 py-2 rounded-lg shadow-sm border border-gray-100 text-gray-500 font-serif italic pointer-events-auto ml-auto">
            文君製作
        </div>
    </div>

    <script>
        // =========================================================================
        // ▼▼▼▼▼ 請將您的 Google Apps Script 網址貼在下方 ▼▼▼▼▼
        // =========================================================================
        
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3g6QTe9WmylwUJFQKad6kssAL9_pTbu4U0Oic48XCanjX8B7SKGzHGP7OnLDnegX-Kw/exec"; 
        
        // =========================================================================

        const TOTAL_STUDENTS = 24;
        let timerInterval;
        let startTime = 0;
        let runStartTimestamp = ""; 
        let elapsedTime = 0;
        let isRunning = false;
        let studentResults = {}; 

        document.addEventListener('DOMContentLoaded', () => {
            generateStudents();
            const today = new Date();
            const weekString = getWeekString(today);
            document.getElementById('queryWeekInput').value = weekString;
        });

        function switchTab(tabName) {
            const timerSection = document.getElementById('timerSection');
            const querySection = document.getElementById('querySection');
            const resetBtn = document.getElementById('resetBtn');
            const tabTimer = document.getElementById('tab-timer');
            const tabQuery = document.getElementById('tab-query');

            if (tabName === 'timer') {
                timerSection.classList.remove('hidden');
                querySection.classList.add('hidden');
                resetBtn.classList.remove('hidden');
                tabTimer.classList.add('active');
                tabQuery.classList.remove('active');
            } else {
                timerSection.classList.add('hidden');
                querySection.classList.remove('hidden');
                resetBtn.classList.add('hidden');
                tabTimer.classList.remove('active');
                tabQuery.classList.add('active');
            }
        }

        // === 計時器邏輯 ===
        function generateStudents() {
            const grid = document.getElementById('studentGrid');
            const tableBody = document.getElementById('scoreTableBody');
            grid.innerHTML = '';
            tableBody.innerHTML = '';
            studentResults = {};
            for (let i = 1; i <= TOTAL_STUDENTS; i++) {
                const btn = document.createElement('button');
                btn.id = `student-${i}`;
                btn.className = 'btn-circle-student w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-white border-4 border-gray-200 text-xl font-bold text-gray-400 flex items-center justify-center focus:outline-none';
                btn.textContent = i;
                btn.onclick = () => recordTime(i);
                btn.disabled = true; 
                grid.appendChild(btn);
            }
        }

        function formatTime(ms) {
            const date = new Date(ms);
            const m = date.getUTCMinutes().toString().padStart(2, '0');
            const s = date.getUTCSeconds().toString().padStart(2, '0');
            const msText = Math.floor(date.getUTCMilliseconds() / 10).toString().padStart(2, '0');
            return `${m}:${s}.${msText}`;
        }

        function getCurrentDateTimeStr() {
            const now = new Date();
            return now.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }

        function toggleTimer() {
            const btn = document.getElementById('mainControlBtn');
            const studentBtns = document.querySelectorAll('#studentGrid button');
            const startTimeDisplay = document.getElementById('startTimeDisplay');

            if (!isRunning) {
                isRunning = true;
                startTime = Date.now() - elapsedTime;
                if (!runStartTimestamp) {
                    runStartTimestamp = getCurrentDateTimeStr();
                    startTimeDisplay.textContent = `起跑時間：${runStartTimestamp}`;
                }
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    document.getElementById('timerDisplay').textContent = formatTime(elapsedTime);
                }, 30);
                btn.textContent = '計時結束';
                btn.className = 'mb-10 px-10 py-4 text-2xl font-bold rounded-full text-white shadow-lg transform transition hover:-translate-y-1 hover:shadow-xl bg-red-500 hover:bg-red-600 focus:outline-none ring-4 ring-red-200';
                studentBtns.forEach(b => {
                    if (!studentResults[b.textContent]) {
                        b.disabled = false;
                        b.classList.remove('text-gray-400', 'border-gray-200');
                        b.classList.add('text-blue-600', 'border-blue-400', 'hover:bg-blue-50', 'bg-white');
                    }
                });
                document.getElementById('resultSection').classList.add('hidden');
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                btn.textContent = '計時開始';
                btn.className = 'mb-10 px-10 py-4 text-2xl font-bold rounded-full text-white shadow-lg transform transition hover:-translate-y-1 hover:shadow-xl bg-green-500 hover:bg-green-600 focus:outline-none ring-4 ring-green-200';
                studentBtns.forEach(b => b.disabled = true);
                renderResultTable();
            }
        }

        function recordTime(seatNum) {
            if (!isRunning) return;
            const currentTimeStr = formatTime(elapsedTime);
            studentResults[seatNum] = currentTimeStr;
            const btn = document.getElementById(`student-${seatNum}`);
            btn.disabled = true;
            btn.classList.remove('text-blue-600', 'border-blue-400', 'hover:bg-blue-50', 'bg-white');
            btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'scale-95');
            btn.innerHTML = `${seatNum}<br><span class="text-xs">${currentTimeStr.split('.')[0]}</span>`;
        }

        function renderResultTable() {
            const tableBody = document.getElementById('scoreTableBody');
            tableBody.innerHTML = '';
            for (let i = 1; i <= TOTAL_STUDENTS; i++) {
                const time = studentResults[i] || '--:--.--';
                const status = studentResults[i] ? '<span class="text-green-600 font-bold">已完成</span>' : '<span class="text-red-400">未完成</span>';
                const row = `<tr class="hover:bg-gray-50 transition"><td class="font-bold text-lg">${i}</td><td class="font-mono text-lg font-medium">${time}</td><td>${status}</td></tr>`;
                tableBody.innerHTML += row;
            }
            document.getElementById('resultSection').classList.remove('hidden');
            setTimeout(() => document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
        }

        function resetAll() {
            Swal.fire({
                title: '確定重置?', text: "所有的成績紀錄將會被清除！", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: '是的，清除重置', cancelButtonText: '取消'
            }).then((result) => {
                if (result.isConfirmed) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    startTime = 0; elapsedTime = 0; runStartTimestamp = ""; studentResults = {};
                    document.getElementById('timerDisplay').textContent = "00:00.00";
                    document.getElementById('startTimeDisplay').textContent = "";
                    const mainBtn = document.getElementById('mainControlBtn');
                    mainBtn.textContent = '計時開始';
                    mainBtn.className = 'mb-10 px-10 py-4 text-2xl font-bold rounded-full text-white shadow-lg transform transition hover:-translate-y-1 hover:shadow-xl bg-green-500 hover:bg-green-600 focus:outline-none ring-4 ring-green-200';
                    document.getElementById('resultSection').classList.add('hidden');
                    generateStudents();
                    Swal.fire('已重置', '資料已清除', 'success');
                }
            });
        }

        async function uploadToGoogleSheets() {
            if (Object.keys(studentResults).length === 0) { Swal.fire('沒有資料', '請先進行計時', 'info'); return; }
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("EXAMPLE") || GOOGLE_SCRIPT_URL.length < 10) { Swal.fire({title: '尚未設定網址', html: `請修改 html 中的 GOOGLE_SCRIPT_URL`, icon: 'error'}); return; }
            
            const studentsData = [];
            for (let i = 1; i <= TOTAL_STUDENTS; i++) { if (studentResults[i]) studentsData.push({ seat: i, time: studentResults[i] }); }
            const payload = { header: runStartTimestamp || getCurrentDateTimeStr(), data: studentsData };
            
            Swal.fire({ title: '上傳中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const formData = new FormData();
                formData.append('payload', JSON.stringify(payload));
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' });
                Swal.fire('已發送', '資料已送出至 Google 試算表', 'success');
            } catch (error) { Swal.fire('發送失敗', '請檢查網路或網址', 'error'); }
        }

        // ======================= 查詢功能邏輯 =======================

        async function fetchAndFilterData() {
            const weekInput = document.getElementById('queryWeekInput').value;
            if (!weekInput) { Swal.fire('請選擇週次', '', 'warning'); return; }
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("EXAMPLE") || GOOGLE_SCRIPT_URL.length < 10) { Swal.fire({title: '尚未設定網址', html: `請修改 html 中的 GOOGLE_SCRIPT_URL`, icon: 'error'}); return; }

            const [year, week] = weekInput.split('-W').map(Number);
            const weekStart = getDateOfWeek(week, year);
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekEnd.getDate() + 6);
            weekEnd.setHours(23, 59, 59, 999);

            const statusText = document.getElementById('queryStatusText');
            statusText.textContent = `正在查詢 ${weekStart.toLocaleDateString()} ~ ${weekEnd.toLocaleDateString()} 的資料...`;
            
            Swal.fire({ title: '查詢中...', text: '正在從 Google 試算表讀取資料', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // 使用 timestamp 參數避免快取
                const fetchUrl = GOOGLE_SCRIPT_URL + (GOOGLE_SCRIPT_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
                
                const response = await fetch(fetchUrl);
                
                if (!response.ok) {
                    throw new Error('網路回應不正常 (Status: ' + response.status + ')');
                }

                const json = await response.json();

                if (json.status !== 'success') { throw new Error(json.message || '讀取失敗'); }
                
                const rawData = json.data; 
                if (!rawData || rawData.length === 0) { throw new Error('表格是空的'); }

                const headers = rawData[0]; 
                const rows = rawData.slice(1); 

                const matchedIndices = [];
                for (let i = 1; i < headers.length; i++) {
                    const colDate = new Date(headers[i]);
                    // 寬鬆判斷：如果有日期且有效
                    if (!isNaN(colDate.getTime())) {
                        if (colDate >= weekStart && colDate <= weekEnd) {
                            matchedIndices.push(i);
                        }
                    }
                }

                if (matchedIndices.length === 0) {
                    Swal.fire('查無資料', '該週次沒有跑步紀錄', 'info');
                    statusText.textContent = `該週次 (${weekStart.toLocaleDateString()} ~ ${weekEnd.toLocaleDateString()}) 查無資料`;
                    document.getElementById('queryResultContainer').classList.add('hidden');
                    return;
                }

                const tableHead = document.getElementById('queryTableHead');
                const tableBody = document.getElementById('queryTableBody');
                
                let headHtml = '<tr><th class="w-20">座號</th>';
                matchedIndices.forEach(idx => {
                    const d = new Date(headers[idx]);
                    const displayStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
                    headHtml += `<th>${displayStr}</th>`;
                });
                headHtml += '</tr>';
                tableHead.innerHTML = headHtml;

                let bodyHtml = '';
                const studentMap = {};
                rows.forEach(row => {
                    if(row[0]) studentMap[row[0].toString()] = row;
                });

                for (let i = 1; i <= TOTAL_STUDENTS; i++) {
                    const seatStr = i.toString();
                    const rowData = studentMap[seatStr];
                    
                    let rowHtml = `<tr class="hover:bg-gray-50"><td class="font-bold">${i}</td>`;
                    
                    matchedIndices.forEach(idx => {
                        let time = '--';
                        if (rowData && rowData[idx]) {
                            time = rowData[idx];
                        }
                        const colorClass = time !== '--' ? 'text-blue-600 font-mono font-bold' : 'text-gray-300';
                        rowHtml += `<td class="${colorClass}">${time}</td>`;
                    });
                    rowHtml += '</tr>';
                    bodyHtml += rowHtml;
                }
                tableBody.innerHTML = bodyHtml;

                document.getElementById('queryResultContainer').classList.remove('hidden');
                statusText.textContent = `查詢完成，共找到 ${matchedIndices.length} 筆紀錄`;
                Swal.close();

            } catch (error) {
                console.error(error);
                let msg = '請確認 Google Apps Script 已更新且權限正確 (所有人/Anyone)。';
                if (error.message.includes('Failed to fetch')) {
                    msg += ' <br><b>(瀏覽器攔截了連線，通常是因為權限未設為公開)</b>';
                }
                Swal.fire('查詢失敗', msg + '<br><span class="text-xs text-red-500">' + error.message + '</span>', 'error');
                statusText.textContent = '查詢發生錯誤';
            }
        }

        function getDateOfWeek(w, y) {
            const d = new Date(y, 0, 1 + (w - 1) * 7);
            const dayOfWeek = d.getDay();
            const ISOweekStart = d;
            if (dayOfWeek <= 4)
                ISOweekStart.setDate(d.getDate() - d.getDay() + 1);
            else
                ISOweekStart.setDate(d.getDate() + 8 - d.getDay());
            return ISOweekStart;
        }

        function getWeekString(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            const weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
            return `${d.getUTCFullYear()}-W${weekNo.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
